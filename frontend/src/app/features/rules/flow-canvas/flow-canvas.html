<div
  class="flow-canvas-box"
  role="group"
  [attr.aria-label]="'rules.canvas.label' | transloco"
  #wheelBox
>
  <!-- ngx-vflow paints a literal white on its root svg by default; the canvas box's own base-200 instead (ISC-400). -->
  <!-- The drawing and the controls that act on it, as one area: the legend's strip sits under it
         and the control column is anchored inside the drawing rather than over that strip. -->
  <div class="flow-canvas-draw">
    <vflow
      class="flow-canvas-flow"
      view="auto"
      background="var(--color-base-200)"
      [nodes]="nodes()"
      [edges]="edges()"
      [minZoom]="zoom.min"
      [maxZoom]="zoom.max"
    >
      <ng-template let-ctx nodeHtml>
        @let d = ctx.data();
        <div
          class="flow-canvas-node"
          [attr.data-node]="d.id"
          [style.inline-size.px]="d.width"
          [style.block-size.px]="d.height"
        >
          @if (d.kind === 'stage') {
            <lg-flow-node
              [stage]="d.stage"
              [phaseId]="d.phaseId"
              [count]="count(d.stage.id)"
              [failed]="failed(d.stage.id)"
              [selected]="selected() === d.stage.id"
              [expandable]="expandable(d.stage)"
              [expanded]="isExpanded(d.stage.id)"
              [state]="d.state"
              [elapsed]="d.elapsed"
              [lit]="lit() === null ? null : lit()!.has(d.stage.id)"
              (toggled)="toggle($event)"
            />
          } @else {
            <!-- ISC-406: a link like a stage node, opening its stage's sheet at its own section.
                         Router-driven query parameters, never a fragment (the base-href trap). -->
            <a
              class="type-caption flow-canvas-sub"
              routerLink="."
              queryParamsHandling="merge"
              [queryParams]="{ stage: d.stageId, section: d.id }"
              [attr.data-sub]="d.id"
            >
              <lg-icon
                class="flow-canvas-sub-icon"
                [name]="d.icon"
                [size]="14"
                [attr.data-icon]="d.icon"
              />
              <span class="flow-canvas-sub-text">
                @if (d.key; as key) {
                  {{ key | transloco }}
                } @else {
                  {{ d.text }}
                }
              </span>
            </a>
          }
          <!-- Anchors only, on the sides the layout's edges use; flow-canvas.css hides their dots. -->
          @for (h of d.handles; track h.id) {
            <handle
              aria-hidden="true"
              [id]="h.id"
              [type]="h.type"
              [position]="h.position"
              [offsetX]="h.offsetX"
              [attr.data-handle]="h.id"
              [attr.data-type]="h.type"
              [attr.data-position]="h.position"
            />
          }
        </div>
      </ng-template>
      <ng-template let-ctx edge>
        @let paint = ctx.data();
        <!-- ISC-413: the run's place against this edge, carried in `paint.run` and painted by class; the
                 arrow marker stays the canvas's own muted token (comment above `edges`), only the line moves.
                 `is-eclipsed` withholds the connector under an expanded stage — see `EdgePaint`. -->
        <svg:path
          class="flow-edge"
          [class.is-ahead]="paint.run === 'ahead'"
          [class.is-entering]="paint.run === 'entering'"
          [class.is-eclipsed]="paint.eclipsed"
          aria-hidden="true"
          [attr.d]="ctx.path()"
          [attr.marker-end]="ctx.markerEnd()"
          [attr.data-edge]="ctx.edge.id"
          [attr.data-run]="paint.run"
          [attr.data-source-handle]="ctx.edge.sourceHandle"
          [attr.data-target-handle]="ctx.edge.targetHandle"
        />
      </ng-template>
    </vflow>

    <div class="flow-canvas-controls">
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-square"
        data-action="zoom-in"
        [attr.aria-label]="'rules.canvas.zoomIn' | transloco"
        [title]="'rules.canvas.zoomIn' | transloco"
        (click)="zoomIn()"
      >
        <lg-icon name="zoom-in" [size]="16" />
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-square"
        data-action="zoom-out"
        [attr.aria-label]="'rules.canvas.zoomOut' | transloco"
        [title]="'rules.canvas.zoomOut' | transloco"
        (click)="zoomOut()"
      >
        <lg-icon name="zoom-out" [size]="16" />
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-square"
        data-action="fit"
        [attr.aria-label]="'rules.canvas.fit' | transloco"
        [title]="'rules.canvas.fit' | transloco"
        (click)="fit()"
      >
        <lg-icon name="maximize" [size]="16" />
      </button>
      <!-- ISC-408: named by what it will do next. -->
      @let collapse = allExpanded();
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-square"
        data-action="expand-all"
        [attr.aria-label]="
          (collapse ? 'rules.canvas.collapseAll' : 'rules.canvas.expandAll') | transloco
        "
        [title]="(collapse ? 'rules.canvas.collapseAll' : 'rules.canvas.expandAll') | transloco"
        (click)="toggleAll()"
      >
        <lg-icon [name]="collapse ? 'chevrons-down-up' : 'chevrons-up-down'" [size]="16" />
      </button>
      <!-- ISC-407: the graph over the whole window and back. Pure CSS, no Fullscreen API — the
             real full screen hid the browser's own tabs and address bar, which is the wrong trade
             for a pass that lasts eleven minutes, and it is gone (operator, 2026-09-26). -->
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-square"
        data-action="fullscreen"
        [attr.aria-pressed]="wide() ? 'true' : 'false'"
        [attr.aria-label]="
          (wide() ? 'rules.canvas.restore' : 'rules.canvas.fillWindow') | transloco
        "
        [title]="(wide() ? 'rules.canvas.restore' : 'rules.canvas.fillWindow') | transloco"
        (click)="wideToggle.emit()"
      >
        <lg-icon [name]="wide() ? 'minimize-2' : 'maximize-2'" [size]="16" />
      </button>
    </div>
  </div>

  <!-- The legend inside the canvas box rather than under it (operator, 2026-09-26): it explains
         the drawing, so it belongs on the drawing's own surface. Projected rather than owned —
         the screen still feeds it, and the pipe below the breakpoint keeps its own copy. A row of
         its own under vflow, not an overlay: an overlay would cover the nodes it explains. -->
  <div class="flow-canvas-legend">
    <ng-content select="[canvasLegend]" />
  </div>
</div>
