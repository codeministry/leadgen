<button type="button" class="lg-chat-minibar" [style.bottom.px]="offset()" (click)="expanded.emit()">
  <span class="sr-only">{{ 'chat.minibar.expand' | transloco }}:</span>
  <span class="type-small lg-chat-minibar-title">{{ name() || ('chat.new' | transloco) }}</span>
  @if (streaming()) {
    <span class="lg-chat-minibar-busy" aria-hidden="true"></span>
    <span class="sr-only">{{ 'chat.busyLabel' | transloco }}</span>
  }
  <lg-icon class="text-muted lg-chat-minibar-expand" name="chevron-up" [size]="18"/>
</button>
