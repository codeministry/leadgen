<lg-page-header
  [title]="'review.title' | transloco"
  [subtitle]="'review.subtitle' | transloco"
/>

<!--
  A label wrapping a file input rather than a div with a click handler: the keyboard and
  the screen reader get the control for free, and the drop zone is the same element.
-->
<label
  class="drop"
  [class.dragging]="dragging()"
  (dragover)="over($event)"
  (dragleave)="leave()"
  (drop)="drop($event)"
>
  <input class="sr-only" type="file" accept=".md" multiple (change)="pick($event)" />
  <lg-icon name="file-text" [size]="20" />
  <span class="type-small">
    {{ (store.uploading() ? 'review.uploading' : 'review.drop') | transloco }}
  </span>
  <span class="type-caption text-muted">
    {{ 'review.dropHint' | transloco }}
  </span>
</label>

@if (store.error(); as error) {
  <p class="type-small queue-error" role="alert">
    <lg-icon name="triangle-alert" [size]="16" />
    {{ error | transloco }}
  </p>
}

@if (store.documents().length > 0) {
  <p class="type-small text-muted count">{{ summary().key | transloco: summary().params }}</p>

  <div class="queue">
    @for (document of store.documents(); track document.name) {
      <lg-review-card
        [document]="document"
        [busy]="store.busy() === document.name"
        (confirmed)="confirm(document.name, $event)"
        (rejected)="reject(document.name)"
      />
    }
  </div>
} @else if (store.loading()) {
  <p class="type-small text-muted">{{ 'common.loading' | transloco }}</p>
} @else {
  <lg-empty-state
    icon="inbox"
    [title]="'review.emptyTitle' | transloco"
    [description]="'review.emptyHint' | transloco"
  />
}
