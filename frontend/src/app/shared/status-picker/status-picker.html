<!--
  The label is the control's accessible name in both modes; only its visibility changes.
  On a board card the surrounding text says what the control is, so it is read but not
  shown; in a form row it has to be shown, or the select sits a label's height above the
  fields beside it and the row has no common baseline.
-->
<label [class]="labelClass()" [for]="id">{{ label() }}</label>
<!--
  The selection is bound per option rather than with `[value]` on the select, because
  `[value]` depends on the options existing when it is written. When it loses that race
  the browser falls back to the first one, and a card then reads "New" while the badge
  beside it says SENT — no error, and picking the state it is already in looks like
  nothing happening.
-->
<select
        [class]="selectClass()"
        [id]="id"
        [disabled]="disabled()"
        (change)="onChange($event)"
>
    @for (option of options(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">
            {{ option.label }}
        </option>
    }
</select>
