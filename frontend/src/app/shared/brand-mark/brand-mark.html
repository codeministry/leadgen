<span class="brand">
  <!-- The mark, inline rather than masked: it is two colours, the ring on the theme's
       primary and the two dots on the signal, and a CSS mask can only paint one. The
       paths are the same as `frontend/brand/mark.svg`, which is what the favicons are
       rendered from; the viewBox is square, so width follows height one to one. -->
  <svg
          class="mark"
          viewBox="0 0 32 32"
          [style.height.px]="size()"
          [style.width.px]="width()"
          [attr.role]="wordmark() ? null : 'img'"
          [attr.aria-label]="wordmark() ? null : label()"
          [attr.aria-hidden]="wordmark() ? 'true' : null"
          focusable="false"
  >
    <path class="body" d="M16 3a13 13 0 1 0 13 13"/>
    <g class="signal">
      <circle cx="16" cy="16" r="4.6"/>
      <circle cx="27.5" cy="6.5" r="3"/>
    </g>
  </svg>

    <!-- Two halves, two colours: primary carries the structure, the signal is the brand's
         accent. Read as one word by sight, as the product name by a screen reader — hence
         the role/aria-label on the wrapper. -->
    @if (wordmark()) {
        <span class="wordmark" role="img" [attr.aria-label]="label()">
      <span class="wordmark-lead" aria-hidden="true">LEAD</span
      ><span class="wordmark-gen" aria-hidden="true">gen</span>
    </span>
    }
</span>
