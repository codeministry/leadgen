<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Lead Generation</title>
    <base href="/"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="color-scheme" content="light dark"/>
    <!-- The dark surface, so an installed window opens on the app's own colour before the
       first paint. Keep in step with THEME_SURFACE_HEX in core/theme/theme.model.ts and
       the two colours in public/manifest.webmanifest. -->
    <meta name="theme-color" content="#1F222D"/>
    <link rel="manifest" href="manifest.webmanifest"/>
    <!-- The favicon, the 180 touch icon and every icon the manifest names come from
       `brand/mark.svg`, the one drawing of the lead ring, via `frontend/tools/build-favicon.sh`,
       which recolours the ring and the dots by group id and puts the mark on a round plate
       (the tab icon, the manifest's `any` icons) or an opaque square one (the touch icon,
       the manifest's maskable icon). Regenerate, never hand-edit. The header draws the same
       paths inline in `shared/brand-mark/`. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48"/>
    <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
    <script>
        // Runs before the stylesheet resolves, so the page never paints in the wrong
        // theme and then corrects itself. "System" is the *absence* of the attribute:
        // daisyUI emits lg-dark under `:root:not([data-theme])` inside a
        // prefers-color-scheme query, so removing it is what "follow the OS" means.
        // Keep the key in step with THEME_STORAGE_KEY in core/theme/theme.model.ts.
        (function () {
            try {
                var preference = localStorage.getItem('lg-theme');
                if (preference === 'light' || preference === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'lg-' + preference);
                } else if (preference === 'system') {
                    document.documentElement.removeAttribute('data-theme');
                } else {
                    // Nothing stored: the app's default is dark, not the operating
                    // system. Written explicitly rather than left to the media query,
                    // because the absence of the attribute IS "follow the OS" here.
                    // Keep in step with DEFAULT_PREFERENCE in core/theme/theme.store.ts.
                    document.documentElement.setAttribute('data-theme', 'lg-dark');
                }
            } catch (error) {
                // Private mode or storage disabled. Fall through to the media query.
            }

            // The browser's `theme-color` for the first paint: an installed window's title
            // bar takes it from the meta tag, and the static value in the head is the dark
            // surface only. Resolved the way the store resolves it — the attribute if there
            // is one, the media query if there is none — so the bar matches the page from
            // the first frame. The store keeps it in step with every change after that.
            // Keep the two literals in step with THEME_SURFACE_HEX in
            // core/theme/theme.model.ts; the theme store's spec holds them to it.
            var surfaces = {'lg-light': '#FFFFFF', 'lg-dark': '#1F222D'};
            var resolved = document.documentElement.getAttribute('data-theme');
            if (!resolved) {
                resolved =
                    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'lg-dark'
                        : 'lg-light';
            }
            var meta = document.querySelector('meta[name="theme-color"]');
            if (!meta) {
                meta = document.createElement('meta');
                meta.name = 'theme-color';
                document.head.appendChild(meta);
            }
            meta.content = surfaces[resolved] || surfaces['lg-dark'];

            // `lang` for the first paint. Not a flash of the wrong language — nothing is
            // painted yet — but the attribute a screen reader picks its voice from and the
            // browser hyphenates by, and it is wrong on every page until something sets it.
            // Keep the key in step with LANGUAGE_STORAGE_KEY in core/i18n/language.model.ts.
            try {
                var language = localStorage.getItem('lg-language');
                if (language !== 'en' && language !== 'de') {
                    language = (navigator.language || 'en').toLowerCase().split('-')[0];
                }
                document.documentElement.lang = language === 'de' ? 'de' : 'en';
            } catch (error) {
                // Same as above: the default in the markup stands.
            }
        })();
    </script>
</head>
<body>
<lg-root></lg-root>
</body>
</html>
