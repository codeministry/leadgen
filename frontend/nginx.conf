server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API host is a build-time constant here only because the whole stack is
    # one compose file. In the Helm chart (phase 2) this becomes a template value.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
