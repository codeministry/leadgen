server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Images load from this origin only, never from an address a chat answer names (spec 019): the
    # answer renderer already drops every image, and this is the second line should one slip past.
    # img-src and nothing else — a wider policy would have to be proven against the OIDC redirects.
    # `always` so an error page carries it too. Repeated in every location below that adds a
    # header of its own, because such a location drops everything inherited from here.
    add_header Content-Security-Policy "img-src 'self' data: blob:" always;

    # The API host is a build-time constant here only because the whole stack is
    # one compose file. In the Helm chart (phase 2) this becomes a template value.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The chat streams a turn as server-sent events (spec 019). Under `/api/` nginx buffers the
    # response, so no token reaches the drawer until the turn ends, and cuts the stream at the
    # default 60 s read timeout, which a turn with several tool rounds exceeds. The backend sends
    # `X-Accel-Buffering: no` as well; this block holds without it. Longest prefix wins, so every
    # other chat call (list, read, delete, stop) comes through here too, which costs nothing.
    location /api/v1/chat/ {
        proxy_pass http://api:8080/api/v1/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
        add_header Content-Security-Policy "img-src 'self' data: blob:" always;
    }

    # --- PWA cache policy (spec 012, ISC-332) ----------------------------------------
    # The shell, the worker's manifest and the app manifest keep their names across
    # builds, so a cached copy holds a deploy back until it expires. `no-cache` keeps
    # them cacheable but forces a revalidation on every request; nginx answers the
    # conditional request with a 304 from the file's ETag and Last-Modified.
    #
    # Mind: `add_header` inside a location replaces every add_header inherited from
    # the server level. A header added server-wide has to be repeated in these blocks.
    #
    # The deployed chart replaces this file wholesale; the seven blocks below are
    # self-contained so they copy into its ConfigMap as they are.

    # `/` and every SPA fallback land here too: both the `index` directive and the
    # `try_files` below end in an internal redirect to /index.html, which nginx
    # matches against the locations again.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "img-src 'self' data: blob:" always;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "img-src 'self' data: blob:" always;
    }

    # The worker scripts keep their names too. The browser's service-worker update
    # check honours the heuristic HTTP cache when no policy is sent, so without this
    # a new worker can lag behind a deploy by up to a day.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "img-src 'self' data: blob:" always;
    }

    location = /safety-worker.js {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "img-src 'self' data: blob:" always;
    }

    # the nginx image's mime.types has no `webmanifest` entry, so the manifest is
    # served as application/octet-stream (measured before this block existed).
    # An empty `types {}` drops the inherited table for this one location, which is
    # what lets `default_type` apply.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "img-src 'self' data: blob:" always;
    }

    # Angular writes a content hash into every bundle name, so the URL changes
    # whenever the bytes do and the copy may be kept for a year. The pattern requires
    # the hash: the unhashed worker scripts (ngsw-worker.js, safety-worker.js,
    # worker-basic.min.js) fall through to the SPA block below. The pattern is quoted
    # because nginx reads an unquoted `{` as the start of the block.
    location ~* "^/(main|polyfills|scripts|chunk|styles)-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "img-src 'self' data: blob:" always;
    }

    # The fonts under /media/ are hashed the same way by the build. The icons, the
    # i18n catalogs and the help documents are not hashed and are served without a
    # policy on purpose: they are named in ngsw-config.json and the worker refreshes
    # them from its own manifest.
    location ~* "^/media/.+-[A-Za-z0-9_-]{8,}\.(woff2?|ttf)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "img-src 'self' data: blob:" always;
    }

    # Single-page app: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
