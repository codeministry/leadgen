# Demo rules. Same shape as the shipped `matching-rules.yaml`, with the two lists that
# ship empty actually filled in — a hand-drawn list of reachable cities and a remote
# floor — because an empty `onsite_cities` means only remote offers can pass, which on
# screen looks exactly like a quiet market.
version: 1

# --- Stage 1: hard knockout criteria (no model, no network) ----------------
hard_filters:
  remote:
    # Not 80: at a high floor almost nothing survives and the demo shows an empty
    # shortlist with a very good explanation next to it. 40 % means being on site for
    # the other 60 %, which is why the city list below applies at all — at 0 the reach
    # rule switches off entirely and the list stops being read.
    min_remote_percent: 40
    accept_unknown: true
    reject_keywords_de: ["100% vor Ort", "vollständig vor Ort", "kein Remote", "Präsenzpflicht", "5 Tage vor Ort"]
    derive_from:
      - { field: location, contains_any: [remote, homeoffice, ortsunabhängig, deutschlandweit], set: 100 }
      - { field: title,    regex: "(\\d{1,3})\\s*%\\s*remote", set: "$1" }
      - { field: title,    contains_any: [remote], set: 100, confidence: low }

  location:
    country_allowlist: [DE]
    reject_keywords: ["Schweiz", "Österreich", "Zürich", "Wien", "Basel", "Bern", "Genf", "Graz", "Linz",
                       "Salzburg", "Luxemburg", "Niederlande", "Amsterdam", "London", "UK", "USA",
                       "Spanien", "Polen", "Warschau", "Madrid", "relocation", "onsite abroad",
                       "EU-wide onsite"]
    onsite_home_base: "Köln"
    # A list, not a radius: nothing here geocodes, and an offer states its location as
    # free text — "Remote und Köln", "Bonn und Umgebung". Draw it once from a map.
    onsite_cities: ["Köln", "Düsseldorf", "Bonn", "Aachen", "Leverkusen", "Neuss", "Wuppertal",
                     "Duisburg", "Essen", "Dortmund", "Mönchengladbach", "Krefeld", "Koblenz"]
    onsite_exceptions: []

  rate:
    min_hourly_eur: 60
    currency: EUR
    accept_unknown: true
    # The only accepted value, and the loader refuses any other. The corpus states a
    # rate in about two offers in a hundred, exactly as the real one does; applied
    # before enrichment this rule would discard almost everything.
    apply_after: enrichment
    reject_below_as: HARD_FAIL

  role:
    rejected_title_keywords:
      - SAP
      - ABAP
      - Salesforce
      - .NET
      - "C#"
      - PHP
      - ServiceNow
      - Sharepoint
      - Data Scientist
      - Machine Learning Engineer
      - Power BI
      - Scrum Master
      - Product Owner
      - Projektleiter
      - Projektmanager
      - Tester
      - Oracle APEX
      - Mainframe
      - COBOL
      - Embedded
      - SPS
      - iOS
      - Android
      - Flutter
      - React Native
      - Netzwerk
      - First Level
      - Support

  contract:
    allowed: [freiberuflich, Freelance, Dienstvertrag, Werkvertrag]
    rejected: [Festanstellung, Arbeitnehmerüberlassung, ANÜ, Personalvermittlung, Praktikum, Werkstudent]

  language:
    preferred: de
    accepted: [de, en]
    english_only_penalty: 15

  freshness:
    # Deliberately far out of proportion, and only here. The corpus is committed, so it
    # ages with the repository: at the real 21 days a clone made a month from now would
    # open on an entirely archived demo and look broken. Re-run
    # `bun demo/generate-corpus.ts` to date the mails to today, and this can come down.
    max_age_days: 3650

# --- Stage 2: scoring, only for what survived stage 1 ----------------------
scoring:
  weights:
    core_skill_overlap: 45
    role_fit: 15
    industry_fit: 10
    seniority_fit: 10
    project_setup: 10
    rate_fit: 10
  penalties:
    stack_mismatch_dominant: -30
    role_mismatch: -25
    vague_description: -10
  thresholds:
    auto_shortlist: 70
    review: 50
    discard: 0

anti_skills:
  - .NET
  - C#
  - PHP
  - Symfony
  - Laravel
  - SAP
  - ABAP
  - Salesforce CRM
  - ServiceNow
  - React Native
  - Flutter
  - iOS
  - Swift
  - Android native
  - Data Science
  - Machine Learning Engineering
  - Embedded C

# --- Deduplication --------------------------------------------------------
deduplication:
  # Only the normalized title is actually compared today: the other four fields come
  # from enrichment, which runs after this stage. About one offer in eight of the
  # generated corpus is the same project through a second portal.
  fingerprint_fields: [normalized_title, city, start_date, duration_months, top_skills]
  strategies:
    - { type: exact_fingerprint, action: merge }
    - { type: embedding_cosine, threshold: 0.92, action: merge }
    - { type: embedding_cosine, threshold: 0.85, action: flag_possible_duplicate }
  merge_policy: keep_first_seen_as_primary
  ttl_days: 60

# --- Follow-up ------------------------------------------------------------
follow_up:
  after_days: 7
  max_reminders: 1
  auto_expire_days: 30
