# Application configuration. Models, thresholds, paths and templates are all
# configurable — none of it lives in the code.
version: 1

# Every value here is empty until .env fills it, and that is the working state:
# without a model the tool still runs — hard filter, dedupe and enrichment are
# deterministic — it only loses scoring and the cover letter.
llm:
  provider: ${LLM_PROVIDER:}            # anthropic | ollama | openai-compatible
  base_url: ${LLM_BASE_URL:}
  api_key: ${LLM_API_KEY}
  # Half the price, at the cost of a synchronous answer: the requests are handed over as
  # one batch and collected by a poller minutes later, so packaging and the digest happen
  # after the collection rather than at the end of the run that submitted. Only the
  # Messages API batch is implemented, and the loader refuses this flag for any other
  # provider rather than quietly scoring at full price. Off by default: a run that answers
  # within itself is the simpler thing to reason about, and the saving is worth having only
  # once the nightly pass is large.
  batch: ${LLM_BATCH:false}
  models:
    # Only `scoring` is read today. The other three name stages that are deterministic or
    # not implemented: extraction has no LLM fallback, the cover letter is a Freemarker
    # template, and the two embedding-based deduplication strategies are logged and
    # skipped. They stay here because the stages exist in the concept, but a value in any
    # of them changes nothing.
    extraction: ${LLM_MODEL_EXTRACTION}  # not read yet
    scoring: ${LLM_MODEL_SCORING}     # the judge, and the default of the list below
    # The alternatives offered in the select beside the run button, comma separated.
    # An allowlist, not a suggestion: the chosen model travels as a request parameter,
    # and a name passed through unchecked is an arbitrary string deciding what gets
    # bought. `scoring` is always the first entry and need not be repeated here.
    scoring_options: ${LLM_MODEL_SCORING_OPTIONS:}
    writing: ${LLM_MODEL_WRITING}     # not read yet
    embedding: ${LLM_MODEL_EMBEDDING}   # not read yet
  budget:
    max_calls_per_day: 300
    cache_by_message_id: true

# File names, resolved against the configuration directory — never a path with the
# directory baked in: inside the container that directory is /config, not
# ./config/local. An absolute path is taken as given.
profile:
  path: ${PROFILE_PATH:skill-profile.yaml}
rules:
  path: ${RULES_PATH:matching-rules.yaml}
  # One switch for all three files: they are read and swapped as one snapshot, so
  # reloading one without the others would give the pipeline a picture that never
  # existed on disk.
  hot_reload: true

# Only for offers that survived the hard filter: fetch the original ad from the
# source portal. Many aggregators provide only a summary, without rate or full text.
enrichment:
  enabled: true
  after: hard_filter
  fetch:
    timeout: PT10S
    rate_limit_per_minute: 20
    # How many ads one pass will wait for. The limiter refuses rather than waits, so
    # without this a pass fetches one minute's worth and defers the rest — a backlog then
    # needs one run per `rate_limit_per_minute` offers to clear. Unset means that older
    # behaviour. The window itself is untouched: this only says how long a run waits for
    # permits it would have been granted anyway.
    max_per_run: 200
    user_agent: "lead-generation/0.1"
    cache_ttl: P7D
    respect_robots_txt: true
  extract:
    # A selector or a regular expression per field, never a rule in Java: every
    # portal renders an ad differently, so a new one has to be a YAML block. The
    # field names are the contract with the enrichment stage.
    strategy: patterns
    fields:
      rate:
        regex: '(\d{2,4})\s*(?:€|EUR)\s*/?\s*(?:h|Std|Stunde)'
      duration:
        regex: '(\d{1,2})\s*(?:Monate?|MM)'
      workload:
        regex: '(\d{1,2})\s*(?:PT|Tage?\s*/\s*Woche)'
      remote_percent:
        regex: '(\d{1,3})\s*%\s*(?:remote|Remote)'
      start_date:
        regex: '(?:ab|Start)\D{0,12}(\d{2}\.\d{2}\.\d{4})'
      contact:
        regex: '([A-Za-zÄÖÜäöüß.\- ]+)\s*(?:\||,)?\s*(?:Tel|Telefon)'
      full_text:
        css: 'article, main, .job-description, #content'

# Which parts of a fetched advert are the advert.
#
# A portal's page carries the offer and also everything around it: a meta row, an apply
# button, a report dialog with its radio labels, and a tag cloud taken from the site's own
# taxonomy rather than from the client's requirements. Folded into the skill haystack that
# last one inflates the overlap deciding the shortlist, so this is a fix to the score before
# it is a fix to the screen.
#
# The model is the authority here and these rules are a cache in front of it. Every block is
# hashed, a decision is remembered by that hash, and a portal's furniture is therefore paid
# for once and free for every advert that repeats it. A header form nobody has seen is a hash
# nobody has seen: one call, then free again — so new furniture is noticed by construction
# rather than mislabelled in silence.
#
# Nothing is hidden without a positive decision. A block no rule matched, that the cache does
# not know and that no model answered about stays visible.
content:
  enabled: true
  # Free, deterministic, and deliberately conservative. They exist so a clone with no model
  # configured still hides the obvious furniture — not to be the mechanism. A rule that stops
  # matching costs the shortcut and nothing else: the block falls through to the cache and
  # then to the model.
  #
  # Matched against the block's normalised text: link targets dropped, escapes and emphasis
  # removed, whitespace collapsed, lowercased. So a pattern is written against the words a
  # person reads, on one line, which is what a pattern is for.
  #
  # SINGLE QUOTES. A double-quoted YAML scalar allows only a fixed set of escapes, `\-` is
  # not among them, and the file then fails to parse with nothing pointing at the regex.
  #
  # Every one of these is anchored or specific on purpose. A loose pattern here does not
  # produce a wrong label, it hides a paragraph of somebody's advert — and an ad about data
  # protection is exactly the ad a bare 'datenschutz' would delete.
  rules:
    # The pair and not either word. A block here is a whole paragraph read as one line —
    # measured on the corpus, the company link, the contact, the meta row and both buttons
    # arrive as a single block, so an anchored 'apply now' never fires and a bare one would
    # match an advert that says "bitte jetzt bewerben". Two portal buttons in sequence are
    # something no prose writes.
    - kind: CHROME
      matches: 'apply now\s+save to watchlist|jetzt bewerben\s+zur merkliste'
    - kind: FORM
      matches: 'reason for reporting this project|grund f(?:ü|u)r die meldung'
    - kind: FORM
      matches: 'after submitting, you will receive a confirmation email'
    # The portal's two row actions, rendered as a two-item list, so the block arrives as
    # exactly "Print Report". Anchored to the whole block on purpose: a bare 'report' would
    # match an advert asking for reporting experience, and 'print' one about print media.
    - kind: CHROME
      matches: '^print\s+report$'
    # The report dialog's heading and its submit button. Each is a block of its own and is
    # nothing but these two words, which no sentence in an advert is.
    - kind: CHROME
      matches: '^report project$'
    - kind: AGENCY
      matches: 'amtsgericht\s+\S+,\s*hrb\s*\d'
    - kind: AGENCY
      matches: 'gesch(?:ä|a)ftsf(?:ü|u)hrer:\s'
    - kind: LEGAL
      matches: 'datenschutzerkl(?:ä|a)rung:\s*https?://'

packaging:
  output_dir: ${PACKAGES_DIR:./packages}
  naming: "{date}_{company}_{slug}"
  documents:
    - id: cv
      source: profile.cv_variants
      by: offer.language
    - id: cover_letter
      template: "templates/cover-letter.{lang}.ftl"
      generated: true
    - id: offer
      template: "templates/offer-archive.ftl"
    - id: meta
      format: json

# The digest is a rendered file, not a message. There is no transport here because
# the application has no send path at all: it writes text or HTML, a human reads it
# and decides. Same rule as the application packages.
digest:
  enabled: true
  # No schedule here on purpose: the digest is written at the end of an
  # ingest run, so whatever schedules the run schedules the digest. A cron
  # nothing reads is the decoration this file has been losing all day.
  format: ${DIGEST_FORMAT:html}         # text | html
  output_dir: ${DIGEST_DIR:./packages/digest}
  include: [ shortlisted, review, follow_ups_due ]

security:
  auth: ${AUTH_MODE:none}               # none | basic | oidc
  oidc:
    issuer: ${OIDC_ISSUER:}
    client_id: ${OIDC_CLIENT_ID:}
