# Sources are fully declarative. No provider, no newsletter and no portal is wired
# into the code — a new source is a YAML block, not a deploy.
# Copy to config/local/sources.yaml and adjust.
version: 1

# --- Connections: credentials exclusively through environment variables ----
connections:
  - id: mailbox-primary
    type: imap
    host: ${IMAP_HOST}
    port: ${IMAP_PORT:993}
    ssl: true
    username: ${IMAP_USER}
    password: ${IMAP_PASSWORD}
    mode: poll              # poll | idle
    poll_interval: PT15M

# --- Sources ---------------------------------------------------------------
sources:

  # A) A newsletter mail bundling several offers in one message
  - id: sample-newsletter
    enabled: false
    type: imap
    connection: mailbox-primary
    selector:
      # The folder is a server-side path and the separator is the server's to
      # choose: "/" on Dovecot, "." on Courier. A leading separator is not part of
      # the name, so "/Jobs" as a mail client shows it is read as "Jobs". A folder
      # inside the inbox is usually "INBOX/Jobs". A name that does not exist fails
      # the source with the list of folders the mailbox actually has.
      folder: INBOX
      from: ["newsletter@example.com"]
      subject_matches: ".*new projects.*"
      since_days: 3
      # Dedicated mode: set this when the folder holds nothing but this newsletter, and
      # drop `from`/`subject_matches`. Filter mode is the case above.
      match_all: false
      mark_seen: false
      # The only accepted value, and deliberately so: the same mailbox is read on a
      # phone, and a cursor based on seen/unseen would skip whatever was opened there
      # first. Progress is UIDVALIDITY/UID.
      state: uid
    # Same extraction as `local-eml` below — a mail is a mail, whether it arrives over
    # IMAP or lies in a folder. Only the way of getting at it differs.
    extraction:
      strategy: html-blocks
      block_selector: "div.job-card"
      # `multipart/alternative` orders its parts least-preferred first, so the plain-text
      # version comes before the HTML one and has none of the structure below.
      prefer_part: html
      # The one check nothing else can make: a selector that stops matching loses offers,
      # and fewer offers looks exactly like a quiet day on the market. The first group is
      # the number the document claims about itself; a mismatch is logged loudly and does
      # not discard what did come through.
      expect_count_from_subject: "^(\\d+)"
      fields:
        title:       { css: "h3.job-title" }
        description: { css: "div.job-description" }
        # The link is a tracking proxy. `target` is the real address; everything else
        # in the query is discarded, because the rest of it carries the subscriber's
        # mail address and that must not reach the archive.
        url:         { css: "a.job-link", attr: href, unwrap_query_param: target }
        # Four spans in one row, told apart only by their prefix. Never by position:
        # an offer without a company shifts every following field by one.
        agency:      { css: "div.job-meta span", prefix: "🏢 " }
        location:    { css: "div.job-meta span", prefix: "📍 " }
        # `format` describes the WHOLE value, time included. The archive keeps only the
        # date: the time carries no zone, and the freshness rule counts days.
        published:   { css: "div.job-meta span", prefix: "📅 ", format: "dd.MM.yyyy – HH:mm 'Uhr'" }
        portal:      { css: "div.job-meta span", prefix: "🔗 " }
        # The search tags belong to the group the block sits in, not to the block.
        tags:        { ancestor: "div.tag-group", css: "h2.tag-header", list: true, split: "+" }
      fallback: none

    defaults:
      language: de
      channel: newsletter

  # B) A portal feed from a saved search
  - id: sample-portal-feed
    enabled: false
    type: rss                        # rss | atom
    url: "${SAMPLE_FEED_URL}"
    schedule: PT30M
    extraction:
      strategy: single               # one item = one offer
      fields:
        title:       { path: title }
        url:         { path: link }
        description: { path: description, html: strip }
        published:   { path: pubDate }
      fallback: llm
    defaults:
      language: de
      channel: portal

  # C) A single enquiry arriving directly in the mailbox
  - id: sample-direct-enquiry
    enabled: false
    type: imap
    connection: mailbox-primary
    selector:
      folder: INBOX
      subject_matches: "(?i).*(enquiry|availability|opportunity).*"
      exclude_from: ["newsletter@example.com"]
      state: uid
    extraction:
      strategy: llm                  # free-form prose, no structure to expect
    defaults:
      channel: direct

  # D) Local files — for tests and replays without network access. Also the worked
  #    example of a fully deterministic extraction: every field below comes out of
  #    the markup, so `fallback: none` and no language model is involved at all.
  #
  #    The eight field names are the contract with the pipeline. A field spelled
  #    differently is extracted and then ignored, silently.
  - id: local-eml
    enabled: false
    type: file
    path: ${INBOX_DIR:./data/inbox}
    glob: "*.eml,*.html"
    extraction:
      # A mail is a mail, whether it arrives over IMAP or lies in a folder. Two copies
      # of a selector table drift, and the copy nobody looks at drifts unnoticed.
      inherit: sample-newsletter