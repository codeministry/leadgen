# The server's own sentence for each suggestion trigger and follow-up, shown whenever no model
# phrases it. Keyed by the candidate's sentenceKey; {count} and the candidate's params are
# filled in. English is the API's default; chat-suggest_de.properties is chosen by Accept-Language.
chat.suggest.newOffers=The last run brought {count} new offers, {shortlisted} of them shortlisted. Which should I look at first?
chat.suggest.deadlines={count} offers close their applications soon. Which should I apply to first?
chat.suggest.noReply={count} applications have had no reply for {days} days. Which should I follow up on?
chat.suggest.tagRise=Offers asking for {tag} rose to {count} in the last {days} days, from {previous}. What is behind it?
chat.suggest.pinned=What do the {offers} pinned offers and {views} pinned views have in common?
chat.suggest.shortlist={count} offers are on the shortlist. Which fits my profile best?
chat.suggest.openApplications={count} applications are open. Where does each one stand?

chat.followup.compare=Compare offer #{a} with offer #{b}.
chat.followup.offer=Tell me more about offer #{a}.
chat.followup.fit=How well does offer #{a} fit my profile?
chat.followup.application=What is the next step for application #{a}?
chat.followup.statistics=How does this compare with the period before?
chat.followup.profile=Which shortlisted offers fit this profile best?
chat.followup.shortlist=What is new on the shortlist?
chat.followup.open=Which applications are waiting for a reply?
