# Every value that differs per machine arrives as an environment variable, with a
# default that matches docker-compose.yml. Nothing individual belongs in here —
# this file is committed.
spring:
  application:
    name: lead-generation
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:leadgen}
    username: ${POSTGRES_USER:leadgen}
    password: ${POSTGRES_PASSWORD:leadgen}
  jpa:
    # Flyway owns the schema. Hibernate only validates that the entities match
    # what the migrations built; `update` would let the two drift apart silently.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# The configuration layer (order of work, step 2) reads these directories. They
# are gitignored and hold everything individual: sources, rules, profile,
# documents.
leadgen:
  config-dir: ${LEADGEN_CONFIG_DIR:../config/local}
  # How often the three files are checked for changes. Two polls are needed before a
  # change is applied, so the worst case is twice this value.
  config-poll-interval: ${CONFIG_POLL_INTERVAL:PT2S}
  packages-dir: ${PACKAGES_DIR:../packages}
  inbox-dir: ${INBOX_DIR:../data/inbox}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    de.codeministry.leadgen: ${LOG_LEVEL:INFO}
