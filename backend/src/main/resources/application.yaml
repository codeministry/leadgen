# Every value that differs per machine arrives as an environment variable, with a
# default that matches docker-compose.yml. Nothing individual belongs in here —
# this file is committed.
spring:
  application:
    name: lead-generation
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:leadgen}
    username: ${POSTGRES_USER:leadgen}
    password: ${POSTGRES_PASSWORD:leadgen}
  flyway:
    enabled: true
    locations: classpath:db/migration

# Working defaults for the pipeline ship on the classpath under /leadgen/. This
# directory overrides them file by file and holds everything individual: real
# sources, credentials, the profile, the documents. It is gitignored, and it does
# not have to exist — without it the defaults apply.
leadgen:
  config-dir: ${LEADGEN_CONFIG_DIR:config}
  # How often the three files are checked for changes. Two polls are needed before a
  # change is applied, so the worst case is twice this value.
  config-poll-interval: ${CONFIG_POLL_INTERVAL:PT2S}
  packages-dir: ${PACKAGES_DIR:../packages}
  inbox-dir: ${INBOX_DIR:../data/inbox}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    de.codeministry.leadgen: ${LOG_LEVEL:INFO}
