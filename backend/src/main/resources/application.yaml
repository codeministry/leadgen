# Every value that differs per machine arrives as an environment variable, with a
# default that matches docker-compose.yml. Nothing individual belongs in here —
# this file is committed.
spring:
  application:
    name: lead-generation
  servlet:
    multipart:
      # An advert is a few kilobytes. The service checks the size again itself, because
      # this limit belongs to the container and the rule belongs to the endpoint.
      max-file-size: 512KB
      max-request-size: 1MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:leadgen}
    username: ${POSTGRES_USER:leadgen}
    password: ${POSTGRES_PASSWORD:leadgen}
  flyway:
    enabled: true
    locations: classpath:db/migration

# Working defaults for the pipeline ship on the classpath under /leadgen/. This
# directory overrides them file by file and holds everything individual: real
# sources, credentials, the profile, the documents. It is gitignored, and it does
# not have to exist — without it the defaults apply.
leadgen:
  # What the header shows, and the only place the running build names itself. Without this
  # line the literal default in StatusController applies and every image reports 0.1.0 —
  # the Gradle version is not injected into the jar, and the Dockerfile copies libs/*.jar
  # by glob, so nothing else carries it either. The deploy sets it from the image tag.
  version: ${LEADGEN_VERSION:0.1.0}
  config-dir: ${LEADGEN_CONFIG_DIR:config}
  # How often the three files are checked for changes. Two polls are needed before a
  # change is applied, so the worst case is twice this value.
  config-poll-interval: ${CONFIG_POLL_INTERVAL:PT2S}
  # How often a submitted scoring batch is asked whether it has ended. Only read when
  # `llm.batch` is on. Five minutes because the provider's own turnaround is measured in
  # minutes and its ceiling in hours: polling faster buys nothing and costs a request each
  # time, and the run it belongs to has already finished either way.
  score-batch-poll-interval: ${SCORE_BATCH_POLL_INTERVAL:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  # `security.auth` is `none` and only `none` is implemented, so this is what stands in
  # front of the write endpoints: the service is reachable from this machine and nowhere
  # else. A container has to bind every interface to be reachable through its published
  # port, which is why docker-compose.yml overrides it — and publishing that port to
  # anything but 127.0.0.1 is the decision that would need an auth mode first.
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  level:
    de.codeministry.leadgen: ${LOG_LEVEL:INFO}
