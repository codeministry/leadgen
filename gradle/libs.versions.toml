[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
testcontainers = "1.21.3"
# Pinned here rather than taken from the Boot BOM: Boot 4 no longer manages jsoup.
jsoup = "1.21.2"
# Pinned explicitly rather than taken from the Boot BOM: Lombok hooks into javac
# internals, so a JDK bump is exactly where it breaks. A version the BOM moves under
# us should show up as a diff here, not as a compile error.
lombok = "1.18.46"
greenmail = "2.1.9"
# Standalone (shaded) rather than the plain artifact: it brings its own Jetty and
# would otherwise fight the one Boot puts on the test classpath.
wiremock = "3.13.1"
# Pinned rather than taken from the Boot BOM for the same reason as jsoup:
# a template that stops rendering should show up as a diff here.
freemarker = "2.3.34"
# The HTML-to-Markdown converter, pinned for the same reason as the two above: an ad
# that suddenly renders differently should show up as a diff here.
flexmark = "0.64.8"
# Spring AI. Two starters rather than three: the OpenAI one already covers every
# OpenAI-compatible endpoint including Ollama, because `base_url` decides who answers, and a
# third model module would buy nothing. Pinned rather than tracked for the same reason jsoup
# and freemarker are — a judge that suddenly answers differently should show up as a diff.
springAi = "2.0.1"
# Formatting and the SPDX header, both enforced by `check` rather than remembered.
spotless = "7.0.4"
# palantir-java-format rather than google-java-format: 120 columns and 8-space
# continuation indents are what this tree was already written in, so adopting it is a
# small diff. The version is pinned because a formatter bump rewrites every file it
# touches, and that has to be a deliberate commit rather than a surprise in CI.
palantirJavaFormat = "2.68.0"
# 0.8.12 is the first release that reads Java 21 class files without a warning.
jacoco = "0.8.13"

[libraries]
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
spring-ai-chat = { module = "org.springframework.ai:spring-ai-client-chat" }
spring-ai-anthropic = { module = "org.springframework.ai:spring-ai-anthropic" }
spring-ai-openai = { module = "org.springframework.ai:spring-ai-openai" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
greenmail-junit5 = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }
flexmark-html2md = { module = "com.vladsch.flexmark:flexmark-html2md-converter", version.ref = "flexmark" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
