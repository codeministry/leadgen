# Phase 1 of the operating plan: postgres, api, web on one machine. Every value comes
# from the untracked `.env.local` (see .env.local.example); nothing individual is written
# here. The file is optional — without it the defaults below bring the stack up, only
# without mailbox and LLM credentials.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgen}
    env_file:
      - path: .env.local
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadgen} -d ${POSTGRES_DB:-leadgen}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgen}
      LEADGEN_CONFIG_DIR: /config
      PACKAGES_DIR: /packages
      INBOX_DIR: /inbox
    env_file:
      - path: .env.local
        required: false
    volumes:
      # The image ships working defaults on its classpath. This mount overrides them
      # file by file with the real sources, rules, profile and CV PDFs — nothing
      # individual is ever baked in.
      - ./config/local:/config:ro
      - ./packages:/packages
      - ./data/inbox:/inbox
    ports:
      - "${SERVER_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"

volumes:
  postgres-data:
