# Phase 1 of the operating plan: postgres, api, web on one machine. Every value
# comes from `.env` (see .env.example); nothing individual is written here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgen}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadgen} -d ${POSTGRES_DB:-leadgen}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgen}
      LEADGEN_CONFIG_DIR: /config
      PACKAGES_DIR: /packages
      INBOX_DIR: /inbox
    env_file:
      # Optional: without it the defaults above apply and the stack still starts,
      # only without mailbox and LLM credentials.
      - path: .env
        required: false
    volumes:
      # Everything individual is mounted, never baked into the image: sources,
      # rules, profile, the fixed CV PDFs, and the finished packages.
      - ./config/local:/config:ro
      - ./packages:/packages
      - ./data/inbox:/inbox
    ports:
      - "${SERVER_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"

volumes:
  postgres-data:
