# Phase 1 of the operating plan: postgres, api, web on one machine. Every value comes
# from the untracked `.env` (see .env.example); nothing individual is written
# here.
#
# One credentials file, `.env`, and it is that name because Compose substitutes the
# `${...}` below from `.env` and from nothing else — not from `env_file:`, which only
# injects INTO a container, and not from `COMPOSE_ENV_FILES` set inside a file (measured:
# that works only as a real environment variable or as `--env-file`). Any other name needs
# a flag on every call or a symlink, and a setup step that can be forgotten silently
# applies the defaults below instead.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgen}
    env_file:
      - path: .env
        required: true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # The container side is fixed at 5432: Postgres binds that port inside the
      # container whatever the host side is. Making both sides variable publishes a
      # host port forwarding to a port nobody listens on, which looks exactly like
      # no port at all — the JDBC driver reports only "connection attempt failed".
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadgen} -d ${POSTGRES_DB:-leadgen}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgen}
      LEADGEN_CONFIG_DIR: /config
      PACKAGES_DIR: /packages
      # The digest directory is its own setting and does not follow PACKAGES_DIR. Left
      # unset it defaults to `./packages/digest`, which inside the container resolves
      # against `/app` — owned by root, while the process runs as `app`. The run then
      # completes every stage and dies on the very last one with an AccessDeniedException
      # naming a path that exists on the host.
      DIGEST_DIR: /packages/digest
      INBOX_DIR: /inbox
      # Two different directories with similar names, and only one of them is written
      # to. `INBOX_DIR` is where the `local-eml` source reads replays from; this is
      # where an upload lands. It has to be named, because its default is a path
      # *inside the configuration directory* — and that one is mounted read-only, so
      # leaving it unset makes every upload fail with a permission error naming a path
      # nobody configured.
      MANUAL_INBOX_DIR: /inbox
      # A container is reachable only through its published port, and a process bound to
      # 127.0.0.1 inside it is reachable through nothing at all.
      SERVER_ADDRESS: 0.0.0.0
    env_file:
      - path: .env
        required: false
    volumes:
      # The image ships working defaults on its classpath. This mount overrides them
      # file by file with the real sources, rules, profile and CV PDFs — nothing
      # individual is ever baked in.
      # `LEADGEN_CONFIG_MOUNT` is what `docker-compose.demo.yml` swaps for `./demo`.
      - ${LEADGEN_CONFIG_MOUNT:-./config}:/config:ro
      - ./packages:/packages
      - ./data/inbox:/inbox
    ports:
      - "${SERVER_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"

volumes:
  postgres-data:
