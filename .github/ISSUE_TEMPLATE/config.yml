# Blank issues stay on: a report that fits none of the three templates is still a report,
# and a form somebody has to fight is a report that never gets filed.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/codeministry/leadgen/security/advisories/new
    about: Report it privately, never as an issue. See SECURITY.md for the threat model.
  - name: Question or idea to discuss first
    url: https://github.com/codeministry/leadgen/discussions
    about: For anything that is not yet a bug or a concrete request.
