# The gate, and it is the same one command a developer runs locally: `./gradlew check`.
# Spotless and the Testcontainers-backed Spring tests for the backend, ESLint, Stylelint,
# tsc and Vitest for the frontend. Nothing is duplicated here that the build already knows,
# because a CI file that reimplements the build drifts from it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you nothing. Cancel it rather than pay for it — except on main,
# where the finished run is the record of what that commit did.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only, deliberately. An explicit block zeroes every scope it does not list, which is
# what you want here — and is also worth knowing about, because on a private repository a
# missing scope surfaces as a 404 rather than as a permission error.
permissions:
  contents: read

jobs:
  check:
    name: ./gradlew check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Pinned to 25 to match the Gradle toolchain. There is no toolchain resolver in
      # `settings.gradle.kts`, so Gradle cannot download a JDK of its own: this step is
      # what puts the toolchain's version on the runner, and a mismatch is loud.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # The frontend is bracketed into the Gradle build with plain `Exec` tasks calling
      # bun, so bun has to exist before `check` runs. Version pinned to what
      # `package.json` declares as its packageManager.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      # The backend tests start a real Postgres through Testcontainers. Ubuntu runners
      # ship Docker, so this needs no service container — and must not have one: the tests
      # own the container's lifecycle and a second Postgres on 5432 would only confuse a
      # failure.
      # No `-x spotlessCheck` any more: Spotless is off in `backend/build.gradle.kts`
      # itself, so the task no longer exists and excluding it would fail the run. Why it is
      # off, and what re-enabling takes, is written where it was switched off.
      - name: Check
        run: ./gradlew check --no-daemon --stacktrace

      # The one thing Spotless was doing that nothing else does. It is off in
      # `backend/build.gradle.kts`, so the SPDX header on a new Java file is copied by hand —
      # and a file without one is a licence statement missing from a published Apache-2.0
      # repository, which nobody notices in review because the header is the part nobody
      # reads. Grep, not a plugin: it is one rule, it needs no formatter, and it says exactly
      # which file is missing it. Re-enabling Spotless replaces this step.
      - name: Every Java file carries its SPDX header
        run: |
          missing=$(find backend/src -name '*.java' -print0 \
            | xargs -0 grep -L 'SPDX-License-Identifier: Apache-2.0' || true)
          if [ -n "$missing" ]; then
            echo "Missing the SPDX header:" >&2
            echo "$missing" >&2
            exit 1
          fi

      # Uploaded rather than gated. A coverage threshold set on the day the tool is
      # introduced is a threshold somebody disables the first time it is inconvenient; the
      # number is worth having as a trend long before it is worth having as a gate.
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            backend/build/reports/jacoco/test/**
            frontend/coverage/**
          if-no-files-found: ignore
          retention-days: 14

      # The one thing worth keeping from a red run.
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/**
            backend/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # A green `check` says the code compiles and passes. It does not say the images build —
  # and the two Dockerfiles are how this is actually run, so a broken one is a broken
  # release. Built, never pushed: publishing happens on a tag, in release.yml.
  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
