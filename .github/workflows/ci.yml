# The gate, and it is the same one command a developer runs locally: `./gradlew check`.
# Spotless and the Testcontainers-backed Spring tests for the backend, ESLint, Stylelint,
# tsc and Vitest for the frontend. Nothing is duplicated here that the build already knows,
# because a CI file that reimplements the build drifts from it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you nothing. Cancel it rather than pay for it — except on main,
# where the finished run is the record of what that commit did.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only, deliberately. An explicit block zeroes every scope it does not list, which is
# what you want here — and is also worth knowing about, because on a private repository a
# missing scope surfaces as a 404 rather than as a permission error.
permissions:
  contents: read

jobs:
  check:
    name: ./gradlew check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Full history, for the migration check at the end of this job and for nothing else.
      # The default is a shallow clone of depth 1, which leaves HEAD a grafted boundary: the
      # base ref can then be fetched and still share no reachable merge base with it, so the
      # three-dot diff errors instead of answering. A guard that cannot answer is worse than
      # no guard, because it is green.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Two JDKs, and the order matters. 25 is the toolchain the code compiles and runs on;
      # there is no toolchain resolver in `settings.gradle.kts`, so it is handed to Gradle by
      # path below. 21 is what Gradle itself runs on, the last one listed becomes JAVA_HOME,
      # because palantir-java-format calls the javac of the JVM it runs in: on 25 and on 27 it
      # fails with NoSuchMethodError on every file, and a newer formatter that does run on 25
      # formats 235 files differently from the tree. Measured 2026-09-23; the tree was formatted
      # by a Gradle running on 21, which is what a local jenv default gives.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5

      # The frontend is bracketed into the Gradle build with plain `Exec` tasks calling
      # bun, so bun has to exist before `check` runs. Version pinned to what
      # `package.json` declares as its packageManager.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      # The backend tests start a real Postgres through Testcontainers. Ubuntu runners
      # ship Docker, so this needs no service container — and must not have one: the tests
      # own the container's lifecycle and a second Postgres on 5432 would only confuse a
      # failure.
      # Spotless runs inside this, and without `-x spotlessCheck`. That exclusion was how
      # the gate came to be green nowhere; it is not coming back, and a formatting
      # disagreement is settled with one reviewed `spotlessApply` instead.
      - name: Check
        run: ./gradlew check --no-daemon --stacktrace -Porg.gradle.java.installations.paths=$JAVA_HOME_25_X64

      # An applied migration is immutable: Flyway hashes the file's bytes, so editing one
      # that a database already ran changes its checksum and every such database refuses to
      # start. `.editorconfig` already stops the IDE formatter from rewriting these files,
      # which covers the accident; it does not cover the deliberate edit, and the symptom
      # appears only in the target environment, never here. This step closes that half.
      #
      # Only on a pull request, because "changed relative to the base" is the only form of
      # the question that has an answer. The checkout above is unshallow, so the base ref is
      # fetched at full depth here rather than to a guessed number of commits: a branch that
      # is further behind the base than the guess would otherwise fail the same silent way a
      # shallow HEAD does.
      #
      # `MDR` and not `M`: Flyway validates a file's checksum *and* its description, so
      # deleting an applied migration and renaming one break a deployed database exactly as
      # editing one does, and neither is an `M`.
      #
      # No `|| true` anywhere in here. It is what made the first version of this step
      # unfailable — inside the command substitution it turns every git error into an empty
      # answer and a green run, which is the one outcome a guard must not have.
      - name: No applied migration was changed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          changed=$(git diff --name-only --diff-filter=MDR \
            "origin/$GITHUB_BASE_REF...HEAD" \
            -- backend/src/main/resources/db/migration/)
          if [ -n "$changed" ]; then
            echo "These migrations are already applied somewhere and must not change:" >&2
            echo "$changed" >&2
            echo "Add a new V<n>__ migration instead." >&2
            exit 1
          fi

      # The SPDX-header grep that stood here while Spotless was off is gone, because
      # `licenseHeaderFile` in `backend/build.gradle.kts` does the same job one step
      # earlier and better: `spotlessCheck` in the run above fails on a missing header,
      # and `spotlessApply` writes it rather than reporting it.

      # Uploaded rather than gated. A coverage threshold set on the day the tool is
      # introduced is a threshold somebody disables the first time it is inconvenient; the
      # number is worth having as a trend long before it is worth having as a gate.
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            backend/build/reports/jacoco/test/**
            frontend/coverage/**
          if-no-files-found: ignore
          retention-days: 14

      # The one thing worth keeping from a red run.
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/**
            backend/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # A green `check` says the code compiles and passes. It does not say the images build —
  # and the two Dockerfiles are how this is actually run, so a broken one is a broken
  # release. Built, never pushed: publishing happens on a tag, in release.yml.
  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # `load: true` and a tag, because this image is not only built here: the smoke step
      # below runs it, and a run needs it in the local daemon rather than in buildx's cache.
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: leadgen-api:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # The half `./gradlew check` cannot reach. Those tests say the code is right; this says
      # the *artifact* is, which is a different question once a build step decides what the
      # runtime can still see. It brings up its own compose project against its own volume and
      # tears it down on exit, so it cannot touch anything else on the runner.
      #
      # Here and not in `check`, because it needs the image that the step above just built, and
      # on a Linux runner rather than a laptop, because that is the only startup number worth
      # comparing across runs. The suite prints its row into the job summary.
      #
      # `SMOKE_KEEP=1` only because of the step after it: the suite's own trap would otherwise
      # remove the containers before anything could read their logs, and a red run whose logs
      # are already gone is the failure mode this suite exists to avoid elsewhere. The runner
      # is thrown away either way; the teardown at the end is there so the two steps stay
      # honest about who cleans up.
      # `docker-compose.yml` declares `.env` as required, and a runner has none. The values in
      # the example are placeholders; the suite overrides every one it cares about.
      - name: Compose needs an .env
        run: cp .env.example .env

      - name: Smoke the backend image
        env:
          SMOKE_IMAGE: leadgen-api:ci
          SMOKE_KEEP: '1'
        run: backend/smoke/smoke.sh

      - name: Smoke logs
        if: failure()
        run: docker compose -f docker-compose.yml -f backend/smoke/docker-compose.smoke.yml -p leadgen-smoke logs --no-color --tail 200 || true

      - name: Smoke teardown
        if: always()
        run: docker compose -f docker-compose.yml -f backend/smoke/docker-compose.smoke.yml -p leadgen-smoke down -v --remove-orphans || true
