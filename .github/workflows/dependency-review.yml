# What a pull request adds to the dependency tree, before it is merged rather than after.
# The licence check matters as much as the vulnerability one here: this project is
# Apache-2.0, and a copyleft transitive dependency arriving unnoticed is a licensing
# problem that is expensive to undo later.
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Denied rather than allowed: an allowlist has to be maintained against every
          # licence identifier the ecosystem uses, and the failure mode of an incomplete
          # one is a red build on a perfectly fine package.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure
